<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zephyr | Access Portal</title>

  <!-- Supersonic Monogram Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='rc' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2338bdf8'/%3E%3Cstop offset='60%25' stop-color='%236366f1'/%3E%3Cstop offset='100%25' stop-color='%234338ca'/%3E%3C/linearGradient%3E%3ClinearGradient id='rv' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23c084fc'/%3E%3Cstop offset='50%25' stop-color='%23818cf8'/%3E%3Cstop offset='100%25' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3ClinearGradient id='gs' x1='0%25' y1='0%25' x2='0%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ffffff' stop-opacity='0.85'/%3E%3Cstop offset='100%25' stop-color='%23ffffff' stop-opacity='0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M18 22C36 16 74 16 86 22C70 32 40 34 18 34Z' fill='url(%23rc)'/%3E%3Cpath d='M18 22C36 16 74 16 86 22L78 26C66 21 34 21 18 26Z' fill='url(%23gs)'/%3E%3Cpath d='M86 22L30 76L46 76L86 34Z' fill='url(%23rv)'/%3E%3Cpath d='M14 78C26 68 58 66 82 76C66 84 32 84 14 78Z' fill='url(%23rc)'/%3E%3Cpath d='M14 78C28 72 60 72 82 76L76 80C58 76 28 76 14 81Z' fill='url(%23gs)'/></svg>">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ========================================================================= */
    /* THEME SYSTEM & CANVAS BACKGROUND ENGINE                                   */
    /* ========================================================================= */
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #06070b;
      color: #f8fafc;
      overflow-x: hidden;
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    /* Dark Mode Ambient Studio Canvas */
    .site-mountain-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #06070b;
      background-image: 
        radial-gradient(ellipse at 18% 14%, rgba(251, 146, 60, 0.08) 0%, transparent 45%),
        radial-gradient(ellipse at 84% 14%, rgba(99, 102, 241, 0.16) 0%, transparent 50%),
        radial-gradient(ellipse at 48% 85%, rgba(14, 165, 233, 0.09) 0%, transparent 55%),
        radial-gradient(ellipse at 78% 65%, rgba(168, 85, 247, 0.10) 0%, transparent 45%),
        linear-gradient(180deg, #07090f 0%, #030407 100%);
      pointer-events: none;
      z-index: 0;
      transition: background-image 0.4s ease, background-color 0.4s ease;
    }

    /* Dark Mode Obsidian Panel */
    .obsidian-card {
      background: linear-gradient(180deg, rgba(16, 22, 38, 0.90) 0%, rgba(9, 12, 22, 0.96) 100%);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 35px 80px -20px rgba(0, 0, 0, 0.92), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
    }

    /* ========================================================================= */
    /* 2-COLOR LIGHT THEME (SKY CYAN + PERIWINKLE INDIGO)                        */
    /* ========================================================================= */
    body.light-theme {
      background-color: #dbe4f0;
      color: #0f172a;
    }

    body.light-theme .site-mountain-backdrop {
      background-color: #dbe4f0;
      background-image: 
        radial-gradient(ellipse 70% 80% at 8% 28%, rgba(56, 189, 248, 0.45) 0%, transparent 65%),
        radial-gradient(ellipse 75% 85% at 92% 32%, rgba(99, 102, 241, 0.40) 0%, transparent 65%),
        linear-gradient(135deg, #e0f2fe 0%, #e0e7ff 100%);
    }

    body.light-theme #themeToggleBtn {
      background: rgba(241, 245, 249, 0.92) !important;
      border: 1px solid rgba(195, 206, 222, 0.85) !important;
      color: #4338ca !important;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06) !important;
      backdrop-filter: blur(12px);
    }

    body.light-theme .obsidian-card {
      background: linear-gradient(180deg, rgba(234, 240, 248, 0.95) 0%, rgba(223, 230, 240, 0.98) 100%) !important;
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      border: 1px solid rgba(190, 202, 219, 0.85) !important;
      box-shadow: 
        0 25px 65px -15px rgba(15, 23, 42, 0.14),
        0 8px 24px -8px rgba(15, 23, 42, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.9) !important;
      color: #0f172a !important;
    }

    body.light-theme .obsidian-card h2 {
      color: #0f172a !important;
    }

    body.light-theme .obsidian-card p,
    body.light-theme .obsidian-card label,
    body.light-theme .obsidian-card span {
      color: #334155 !important;
    }

    body.light-theme input:not([type="checkbox"]) {
      background-color: rgba(248, 250, 253, 0.95) !important;
      border: 1px solid rgba(195, 206, 222, 0.9) !important;
      color: #0f172a !important;
      box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.05) !important;
    }

    body.light-theme input:not([type="checkbox"]):focus {
      background-color: #ffffff !important;
      border-color: #6366f1 !important;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18) !important;
    }

    body.light-theme input::placeholder {
      color: #64748b !important;
    }

    body.light-theme input[type="checkbox"] {
      background-color: #ffffff !important;
      border-color: #94a3b8 !important;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

  <div class="site-mountain-backdrop"></div>

  <!-- Theme Toggle Floating Button -->
  <div class="fixed top-5 right-5 z-40">
    <button id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Dark / Day Mode" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 border border-white/20 flex items-center justify-center text-sm font-bold text-amber-400 transition cursor-pointer backdrop-blur-md">
      <span id="themeIcon">☀️</span>
    </button>
  </div>

  <div class="w-full max-w-md obsidian-card rounded-3xl p-8 relative z-20">
    <div class="text-center mb-6">
      
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-[#080a16] p-2 mb-3 border border-white/10 shadow-inner shadow-indigo-500/10">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full drop-shadow-[0_0_10px_rgba(99,102,241,0.55)]">
          <defs>
            <linearGradient id="authRibbonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="60%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="#4338ca"/>
            </linearGradient>
            <linearGradient id="authRibbonViolet" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#c084fc"/>
              <stop offset="50%" stop-color="#818cf8"/>
              <stop offset="100%" stop-color="#06b6d4"/>
            </linearGradient>
            <linearGradient id="authGlassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path d="M 18,22 C 36,16 74,16 86,22 C 70,32 40,34 18,34 Z" fill="url(#authRibbonCyan)"/>
          <path d="M 18,22 C 36,16 74,16 86,22 L 78,26 C 66,21 34,21 18,26 Z" fill="url(#authGlassSheen)"/>
          <path d="M 86,22 L 30,76 L 46,76 L 86,34 Z" fill="url(#authRibbonViolet)"/>
          <path d="M 14,78 C 26,68 58,66 82,76 C 66,84 32,84 14,78 Z" fill="url(#authRibbonCyan)"/>
          <path d="M 14,78 C 28,72 60,72 82,76 L 76,80 C 58,76 28,76 14,81 Z" fill="url(#authGlassSheen)"/>
        </svg>
      </div>
      
      <h2 class="text-2xl font-bold" id="formTitle">Sign In to Zephyr</h2>
      <p class="text-xs opacity-75 mt-1">Manage private vaults, monitor views, and upgrade storage</p>
    </div>

    <!-- Login / Sign Up Form -->
    <div id="authFormSection" class="space-y-4">
      <div>
        <label class="text-xs font-semibold opacity-80 block mb-1">Email Address</label>
        <input id="email" type="email" placeholder="name@domain.com" class="w-full bg-slate-900/40 border border-slate-400/30 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition" />
      </div>
      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="text-xs font-semibold opacity-80">Password</label>
          <button type="button" id="forgotPwdBtn" onclick="toggleForgotView(true)" class="text-xs text-indigo-400 hover:underline transition">Forgot password?</button>
        </div>
        <input id="password" type="password" placeholder="••••••••" class="w-full bg-slate-900/40 border border-slate-400/30 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition" />
      </div>

      <!-- Keep Me Signed In Checkbox -->
      <div class="flex items-center justify-between pt-1">
        <label class="flex items-center gap-2 cursor-pointer select-none">
          <input type="checkbox" id="rememberMeCheckbox" class="w-4 h-4 rounded bg-slate-900/40 border border-slate-400/30 text-indigo-600 focus:ring-0 focus:ring-offset-0 cursor-pointer accent-indigo-600">
          <span class="text-xs opacity-80 font-medium">Keep me signed in on this device</span>
        </label>
      </div>

      <button id="authBtn" onclick="handleAuth()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition text-sm shadow-lg shadow-indigo-600/20 active:scale-[0.98] cursor-pointer">
        Sign In
      </button>

      <p id="authMsg" class="text-xs text-center font-medium hidden"></p>

      <div class="text-center text-xs opacity-75 pt-2">
        <span id="toggleText">Don't have an account?</span>
        <button onclick="toggleMode()" id="toggleBtn" class="text-indigo-400 font-semibold hover:underline ml-1 cursor-pointer">Create Account</button>
      </div>
    </div>

    <!-- Forgot Password View -->
    <div id="forgotSection" class="space-y-4 hidden">
      <p class="text-xs opacity-75">Enter your email address and we'll send you a password reset link.</p>
      <div>
        <label class="text-xs font-semibold opacity-80 block mb-1">Email Address</label>
        <input id="forgotEmail" type="email" placeholder="name@domain.com" class="w-full bg-slate-900/40 border border-slate-400/30 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition" />
      </div>

      <button id="sendResetBtn" onclick="handleForgotPassword()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition text-sm shadow-lg shadow-indigo-600/20 active:scale-[0.98] cursor-pointer">
        Send Reset Link
      </button>

      <p id="forgotMsg" class="text-xs text-center font-medium hidden"></p>

      <div class="text-center text-xs opacity-75 pt-2">
        <button onclick="toggleForgotView(false)" class="hover:underline transition font-semibold cursor-pointer">
          &larr; Back to Sign In
        </button>
      </div>
    </div>

    <!-- Set New Password View -->
    <div id="newPasswordSection" class="space-y-4 hidden">
      <p class="text-xs opacity-75">Create a new secure password for your account.</p>
      <div>
        <label class="text-xs font-semibold opacity-80 block mb-1">New Password</label>
        <input id="newPasswordInput" type="password" placeholder="••••••••" class="w-full bg-slate-900/40 border border-slate-400/30 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition" />
      </div>

      <button id="updatePasswordBtn" onclick="handleUpdatePassword()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition text-sm shadow-lg shadow-indigo-600/20 active:scale-[0.98] cursor-pointer">
        Update Password
      </button>

      <p id="newPassMsg" class="text-xs text-center font-medium hidden"></p>
    </div>
  </div>

  <script>
    function initTheme() {
      const savedTheme = localStorage.getItem("zephyr_theme") || "dark";
      const icon = document.getElementById("themeIcon");
      if (savedTheme === "light") {
        document.body.classList.add("light-theme");
        if (icon) icon.innerText = "🌙";
      } else {
        document.body.classList.remove("light-theme");
        if (icon) icon.innerText = "☀️";
      }
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle("light-theme");
      localStorage.setItem("zephyr_theme", isLight ? "light" : "dark");
      const icon = document.getElementById("themeIcon");
      if (icon) icon.innerText = isLight ? "🌙" : "☀️";
    }

    initTheme();

    const SUPABASE_URL = "{{ supabase_url }}";
    const SUPABASE_ANON = "{{ supabase_anon }}";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    let isSignUp = false;

    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash;
      if (hash.includes('type=recovery')) {
        document.getElementById('formTitle').innerText = 'Set New Password';
        document.getElementById('authFormSection').classList.add('hidden');
        document.getElementById('forgotSection').classList.add('hidden');
        document.getElementById('newPasswordSection').classList.remove('hidden');
      }
    });

    function toggleMode() {
      isSignUp = !isSignUp;
      document.getElementById('formTitle').innerText = isSignUp ? "Create Your Vault Account" : "Sign In to Zephyr";
      document.getElementById('authBtn').innerText = isSignUp ? "Create Account" : "Sign In";
      document.getElementById('toggleText').innerText = isSignUp ? "Already have an account?" : "Don't have an account?";
      document.getElementById('toggleBtn').innerText = isSignUp ? "Sign In" : "Create Account";
      document.getElementById('forgotPwdBtn').classList.toggle('hidden', isSignUp);
      hideMsg('authMsg');
    }

    function toggleForgotView(showForgot) {
      document.getElementById('formTitle').innerText = showForgot ? "Reset Your Password" : (isSignUp ? "Create Your Vault Account" : "Sign In to Zephyr");
      document.getElementById('authFormSection').classList.toggle('hidden', showForgot);
      document.getElementById('forgotSection').classList.toggle('hidden', !showForgot);
      if (showForgot) {
        document.getElementById('forgotEmail').value = document.getElementById('email').value.trim();
      }
      hideMsg('forgotMsg');
      hideMsg('authMsg');
    }

    function persistAuthSession(userId, userEmail, sessionToken = null) {
      const remember = document.getElementById("rememberMeCheckbox")?.checked || false;
      
      localStorage.removeItem("user_id");
      localStorage.removeItem("user_email");
      localStorage.removeItem("vp_user_id");
      localStorage.removeItem("vp_user_email");
      localStorage.removeItem("vp_token");
      sessionStorage.clear();

      if (remember) {
        localStorage.setItem("zephyr_remember_me", "true");
        localStorage.setItem("user_id", userId);
        localStorage.setItem("user_email", userEmail);
        localStorage.setItem("vp_user_id", userId);
        localStorage.setItem("vp_user_email", userEmail);
        if (sessionToken) localStorage.setItem("vp_token", sessionToken);
      } else {
        localStorage.setItem("zephyr_remember_me", "false");
        sessionStorage.setItem("user_id", userId);
        sessionStorage.setItem("user_email", userEmail);
        sessionStorage.setItem("vp_user_id", userId);
        sessionStorage.setItem("vp_user_email", userEmail);
        if (sessionToken) sessionStorage.setItem("vp_token", sessionToken);
      }
    }

    async function handleAuth() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        showMsg('authMsg', "Please enter both email and password.", "text-rose-400");
        return;
      }

      showMsg('authMsg', "Authenticating...", "text-amber-400");

      let res = isSignUp 
        ? await sb.auth.signUp({ email, password }) 
        : await sb.auth.signInWithPassword({ email, password });

      if (res.error) {
        showMsg('authMsg', res.error.message, "text-rose-400");
      } else {
        const userId = res.data?.user?.id;
        const userEmail = res.data?.user?.email || email;
        const token = res.data?.session?.access_token || null;

        if (userId) {
          persistAuthSession(userId, userEmail, token);
        }
        window.location.href = "/dashboard";
      }
    }

    async function handleForgotPassword() {
      const email = document.getElementById('forgotEmail').value.trim();
      const btn = document.getElementById('sendResetBtn');

      if (!email) {
        showMsg('forgotMsg', "Please enter your email address.", "text-rose-400");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Sending...";
      showMsg('forgotMsg', "Sending reset instructions...", "text-amber-400");

      const { data, error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: `${window.location.origin}/auth#type=recovery`
      });

      btn.disabled = false;
      btn.innerText = "Send Reset Link";

      if (error) {
        showMsg('forgotMsg', error.message, "text-rose-400");
      } else {
        showMsg('forgotMsg', "Reset link sent! Check your inbox.", "text-emerald-400");
      }
    }

    async function handleUpdatePassword() {
      const newPassword = document.getElementById('newPasswordInput').value.trim();
      const btn = document.getElementById('updatePasswordBtn');

      if (!newPassword || newPassword.length < 6) {
        showMsg('newPassMsg', "Password must be at least 6 characters.", "text-rose-400");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Updating...";

      const { error } = await sb.auth.updateUser({ password: newPassword });

      btn.disabled = false;
      btn.innerText = "Update Password";

      if (error) {
        showMsg('newPassMsg', error.message, "text-rose-400");
      } else {
        showMsg('newPassMsg', "Password updated! Redirecting...", "text-emerald-400");
        setTimeout(() => {
          window.location.href = "/dashboard";
        }, 1200);
      }
    }

    function showMsg(id, text, colorClass) {
      const el = document.getElementById(id);
      el.className = `text-xs text-center font-medium ${colorClass}`;
      el.innerText = text;
      el.classList.remove('hidden');
    }

    function hideMsg(id) {
      const el = document.getElementById(id);
      el.classList.add('hidden');
      el.innerText = '';
    }
  </script>
</body>
</html>
