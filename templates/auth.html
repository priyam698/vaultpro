<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VaultPro | Access Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-600 font-black text-2xl mb-2">V</div>
      <h2 class="text-2xl font-bold" id="formTitle">Sign In to VaultPro</h2>
      <p class="text-xs text-slate-400 mt-1">Manage private vaults, monitor views, and upgrade storage</p>
    </div>

    <div class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-slate-400 block mb-1">Email Address</label>
        <input id="email" type="email" placeholder="name@domain.com" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-400 block mb-1">Password</label>
        <input id="password" type="password" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
      </div>

      <button id="authBtn" onclick="handleAuth()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-lg font-semibold text-sm transition">Sign In</button>
      
      <p id="authMsg" class="text-xs text-center font-medium hidden"></p>

      <div class="text-center text-xs text-slate-400 pt-2">
        <span id="toggleText">Don't have an account?</span>
        <button onclick="toggleMode()" id="toggleBtn" class="text-indigo-400 font-semibold hover:underline ml-1">Create Account</button>
      </div>
    </div>
  </div>

  <script>
    // Replace these with your Supabase Project URL & Anon Key from Settings -> API
    const SUPABASE_URL = "{{ supabase_url }}";
    const SUPABASE_ANON = "{{ supabase_anon }}";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    let isSignUp = false;

    function toggleMode() {
      isSignUp = !isSignUp;
      document.getElementById('formTitle').innerText = isSignUp ? "Create Your Vault Account" : "Sign In to VaultPro";
      document.getElementById('authBtn').innerText = isSignUp ? "Create Account" : "Sign In";
      document.getElementById('toggleText').innerText = isSignUp ? "Already have an account?" : "Don't have an account?";
      document.getElementById('toggleBtn').innerText = isSignUp ? "Sign In" : "Create Account";
    }

    async function handleAuth() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const msg = document.getElementById('authMsg');

      if (!email || !password) {
        msg.className = "text-xs text-center font-medium text-rose-400";
        msg.innerText = "Please enter both email and password.";
        msg.classList.remove('hidden');
        return;
      }

      msg.className = "text-xs text-center font-medium text-amber-400";
      msg.innerText = "Authenticating...";
      msg.classList.remove('hidden');

      let res = isSignUp ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });

      if (res.error) {
        msg.className = "text-xs text-center font-medium text-rose-400";
        msg.innerText = res.error.message;
      } else {
        localStorage.setItem("vp_token", res.data.session.access_token);
        window.location.href = "/dashboard";
      }
    }
  </script>
</body>
</html>
