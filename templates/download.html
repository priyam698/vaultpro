<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download {{ filename }} | Zephyr</title>
  
  <!-- *** FAVICON UPDATE (Simplified mark) *** -->
  <!-- Updated with a simplified, non-gradient Sapphire version of the new Aerodynamic Wing Z shape for high clarity -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 100 100' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M25 30L75 30L25 70L75 70' stroke='%2338bdf8' stroke-width='14' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #030408;
    }

    #ambientCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    .obsidian-card {
      background: linear-gradient(180deg, rgba(16, 20, 32, 0.75) 0%, rgba(9, 11, 20, 0.9) 100%);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 
        0 30px 60px -12px rgba(0, 0, 0, 0.9),
        0 0 50px -10px rgba(99, 102, 241, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .film-grain {
      background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white relative overflow-x-hidden">

  <!-- Ambient Fluid Canvas -->
  <canvas id="ambientCanvas"></canvas>
  <div class="fixed inset-0 pointer-events-none film-grain z-[1]"></div>

  <!-- Header -->
  <header class="relative z-20 border-b border-white/[0.06] bg-[#030408]/40 backdrop-blur-xl sticky top-0">
    <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3 group">
        
        <!-- *** LOGO UPDATE (Option 4) *** -->
        <!-- Subtly refined container with a matching inner glow for the dynamic mark -->
        <div class="w-10 h-10 rounded-xl bg-[#080a16] border border-white/5 p-2 flex items-center justify-center shadow-inner shadow-indigo-500/10 group-hover:shadow-indigo-500/30 group-hover:border-white/10 transition duration-300">
          <!-- Crystalline Geometry for the Zmark (Option 4) -->
          <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
            <defs>
              <!-- Define the Sapphire to Violet Gradient from Option 4 -->
              <linearGradient id="zephyr-grad-opt4" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8" /> <!-- Sapphire Top -->
                <stop offset="35%" stop-color="#06b6d4" /> <!-- Cyan Mid -->
                <stop offset="70%" stop-color="#a855f7" /> <!-- Violet Mid -->
                <stop offset="100%" stop-color="#4c1d95" /> <!-- Deep Violet Core -->
              </linearGradient>
            </defs>
            <path d="M 256,110 L 390,180 L 256,250 L 120,180 L 256,110 Z" fill="url(#zephyr-grad-opt4)" fill-opacity="0.9"/>
            <path d="M 256,250 L 390,180 L 390,330 L 256,400 L 256,250 Z" fill="url(#zephyr-grad-opt4)" fill-opacity="0.9"/>
            <path d="M 120,180 L 256,250 L 256,400 L 120,330 L 120,180 Z" fill="url(#zephyr-grad-opt4)" fill-opacity="0.9"/>
            
            <!-- Dynamic 'Z' Trace -->
            <path d="M 180,200 L 330,200 L 180,310 L 330,310" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        
        <!-- *** BRAND TEXT UPDATE *** -->
        <!-- Brand name 'Zephyr' now uses the matching sapphire-to-violet gradient and is bolder -->
        <span class="font-extrabold text-2xl tracking-tight bg-gradient-to-tr from-[#38bdf8] via-[#a855f7] to-[#8a38ca] bg-clip-text text-transparent group-hover:to-[#4c1d95] transition duration-300">
          Zephyr
        </span>
      </a>

      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full border border-indigo-500/30 bg-indigo-500/10 text-indigo-300 text-xs font-semibold backdrop-blur-md">
        <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-pulse"></span>
        Direct Cloudflare Delivery
      </div>
    </div>
  </header>

  <!-- Download Portal Card (Unchanged) -->
  <main class="relative z-20 max-w-xl mx-auto px-6 py-12 flex-1 flex flex-col items-center justify-center text-center w-full">
    
    <div class="obsidian-card rounded-3xl p-8 sm:p-10 w-full relative">
      
      <!-- File Icon -->
      <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-indigo-600/30 via-purple-600/25 to-cyan-500/20 border border-white/15 flex items-center justify-center mb-5 shadow-lg shadow-indigo-600/20">
        <svg class="w-8 h-8 text-indigo-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
        </svg>
      </div>

      <!-- File Metadata -->
      <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight break-all">
        {{ filename }}
      </h1>
      <p class="text-xs text-slate-400 mt-2 font-medium">
        {{ filesize }} MB • Total Downloads: <span id="downloadCount" class="text-slate-300 font-semibold">{{ downloads }}</span>
      </p>

      <!-- Password Form & Action Button -->
      <div class="mt-8 space-y-4 text-left">
        <div id="passwordSection" class="{% if not has_password %}hidden{% endif %} space-y-4">
          <div class="rounded-xl border border-amber-500/30 bg-amber-500/10 px-4 py-3 text-xs text-amber-300 flex items-center gap-2.5">
            <svg class="w-4 h-4 text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
            <span>This vault is protected. Enter the passcode to unlock.</span>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">Recipient Passcode</label>
            <input id="passwordInput" type="password" placeholder="Enter recipient password" 
                   class="w-full bg-[#050711] border border-white/10 focus:border-indigo-400 rounded-xl px-4 py-3 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-indigo-400 transition">
          </div>
        </div>

        <!-- Error Message Banner -->
        <div id="errorMsg" class="hidden rounded-xl border border-rose-500/30 bg-rose-500/10 px-4 py-2.5 text-xs text-rose-300 font-medium text-center"></div>

        <!-- Download Button -->
        <button id="downloadBtn" onclick="handleDownload()" 
                class="w-full bg-gradient-to-r from-indigo-600 hover:from-indigo-500 via-purple-600 hover:via-purple-500 to-cyan-600 hover:to-cyan-500 text-white font-bold text-sm py-3.5 rounded-xl shadow-lg shadow-indigo-600/30 active:scale-[0.99] transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer">
          {% if has_password %}Unlock & Download{% else %}Download File{% endif %}
        </button>
      </div>

    </div>

    <p class="mt-8 text-xs text-slate-500">
      Need to send large files? <a href="/" class="text-indigo-400 hover:text-indigo-300 font-medium transition">Send up to 2 GB for free on Zephyr &rarr;</a>
    </p>

  </main>

  <footer class="relative z-20 border-t border-white/[0.06] bg-[#030408]/50 py-5 text-center text-xs text-slate-500">
    © 2026 Zephyr Systems. Zero-knowledge edge transfers.
  </footer>

  <!-- Ambient Fluid Canvas Engine (Unchanged) -->
  <script>
    const canvas = document.getElementById('ambientCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let step = 0;
    function renderAurora() {
      step += 0.003;
      ctx.fillStyle = '#030408';
      ctx.fillRect(0, 0, width, height);

      const x1 = width * 0.35 + Math.sin(step * 0.7) * (width * 0.15);
      const y1 = height * 0.25 + Math.cos(step * 0.5) * (height * 0.12);
      const r1 = Math.max(width, height) * 0.45;
      const g1 = ctx.createRadialGradient(x1, y1, 0, x1, y1, r1);
      g1.addColorStop(0, 'rgba(79, 70, 229, 0.45)');
      g1.addColorStop(0.5, 'rgba(67, 56, 202, 0.18)');
      g1.addColorStop(1, 'rgba(3, 4, 8, 0)');
      ctx.fillStyle = g1;
      ctx.fillRect(0, 0, width, height);

      const x2 = width * 0.75 + Math.cos(step * 0.6) * (width * 0.15);
      const y2 = height * 0.55 + Math.sin(step * 0.8) * (height * 0.15);
      const r2 = Math.max(width, height) * 0.4;
      const g2 = ctx.createRadialGradient(x2, y2, 0, x2, y2, r2);
      g2.addColorStop(0, 'rgba(147, 51, 234, 0.38)');
      g2.addColorStop(0.5, 'rgba(126, 34, 206, 0.15)');
      g2.addColorStop(1, 'rgba(3, 4, 8, 0)');
      ctx.fillStyle = g2;
      ctx.fillRect(0, 0, width, height);

      const x3 = width * 0.25 + Math.cos(step * 0.9) * (width * 0.1);
      const y3 = height * 0.75 + Math.sin(step * 0.7) * (height * 0.1);
      const r3 = Math.max(width, height) * 0.35;
      const g3 = ctx.createRadialGradient(x3, y3, 0, x3, y3, r3);
      g3.addColorStop(0, 'rgba(6, 182, 212, 0.25)');
      g3.addColorStop(0.5, 'rgba(14, 116, 144, 0.1)');
      g3.addColorStop(1, 'rgba(3, 4, 8, 0)');
      ctx.fillStyle = g3;
      ctx.fillRect(0, 0, width, height);

      requestAnimationFrame(renderAurora);
    }
    renderAurora();
  </script>

  <!-- Download & Passcode Handling (Unchanged) -->
  <script>
    async function handleDownload() {
      const btn = document.getElementById("downloadBtn");
      const errBox = document.getElementById("errorMsg");
      const pwdSection = document.getElementById("passwordSection");
      const pwdInput = document.getElementById("passwordInput");
      const password = pwdInput ? pwdInput.value.trim() : null;

      errBox.classList.add("hidden");
      btn.disabled = true;
      btn.innerText = "Verifying & Generating Link...";

      try {
        const res = await fetch(window.location.pathname + "/download", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: password })
        });

        const data = await res.json();

        if (!res.ok) {
          if (res.status === 401 || (data.detail && data.detail.toLowerCase().includes("passcode"))) {
            if (pwdSection) pwdSection.classList.remove("hidden");
            btn.innerText = "Unlock & Download";
            if (pwdInput) pwdInput.focus();
          }
          throw new Error(data.detail || "Incorrect passcode or vault expired.");
        }

        // Trigger browser download
        const a = document.createElement("a");
        a.href = data.download_url;
        a.download = "{{ filename }}";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        // Increment count visually
        const countSpan = document.getElementById("downloadCount");
        if (countSpan) {
          countSpan.innerText = parseInt(countSpan.innerText || 0) + 1;
        }

        btn.innerText = "✓ Download Started";
        setTimeout(() => {
          btn.disabled = false;
          btn.innerText = "Download Again";
        }, 3000);

      } catch (err) {
        errBox.innerText = err.message;
        errBox.classList.remove("hidden");
        btn.disabled = false;
        if (pwdSection && !pwdSection.classList.contains("hidden")) {
          btn.innerText = "Unlock & Download";
        } else {
          btn.innerText = "Download File";
        }
      }
    }
  </script>
</body>
</html>
