<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download {{ filename }} | Zephyr</title>
  
  <!-- Supersonic Monogram Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='rc' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2338bdf8'/%3E%3Cstop offset='60%25' stop-color='%236366f1'/%3E%3Cstop offset='100%25' stop-color='%234338ca'/%3E%3C/linearGradient%3E%3ClinearGradient id='rv' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23c084fc'/%3E%3Cstop offset='50%25' stop-color='%23818cf8'/%3E%3Cstop offset='100%25' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3ClinearGradient id='gs' x1='0%25' y1='0%25' x2='0%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ffffff' stop-opacity='0.85'/%3E%3Cstop offset='100%25' stop-color='%23ffffff' stop-opacity='0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M18 22C36 16 74 16 86 22C70 32 40 34 18 34Z' fill='url(%23rc)'/%3E%3Cpath d='M18 22C36 16 74 16 86 22L78 26C66 21 34 21 18 26Z' fill='url(%23gs)'/%3E%3Cpath d='M86 22L30 76L46 76L86 34Z' fill='url(%23rv)'/%3E%3Cpath d='M14 78C26 68 58 66 82 76C66 84 32 84 14 78Z' fill='url(%23rc)'/%3E%3Cpath d='M14 78C28 72 60 72 82 76L76 80C58 76 28 76 14 81Z' fill='url(%23gs)'/></svg>">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #04060e;
      color: #f8fafc;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .site-mountain-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: 
        radial-gradient(ellipse at 50% 15%, rgba(99, 102, 241, 0.18) 0%, transparent 60%),
        linear-gradient(180deg, rgba(4, 6, 14, 0.8) 0%, rgba(4, 6, 14, 0.65) 45%, rgba(3, 5, 12, 0.9) 100%),
        url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=2400&q=85');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
      z-index: 0;
      transition: background-image 0.4s ease;
    }

    .obsidian-card {
      background: linear-gradient(180deg, rgba(14, 20, 42, 0.84) 0%, rgba(7, 10, 24, 0.95) 100%);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
    }

    body.light-theme {
      background-color: #cbd5e1;
      color: #090d16;
    }

    body.light-theme .site-mountain-backdrop {
      background-image: 
        radial-gradient(ellipse at 50% 12%, rgba(99, 102, 241, 0.14) 0%, transparent 60%),
        linear-gradient(180deg, rgba(203, 213, 225, 0.38) 0%, rgba(180, 195, 215, 0.3) 45%, rgba(203, 213, 225, 0.58) 100%),
        url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2400&q=85');
    }

    body.light-theme header {
      background: transparent !important;
      border-color: transparent !important;
      backdrop-filter: blur(8px);
    }

    body.light-theme header a,
    body.light-theme header span {
      color: #090d16 !important;
    }

    body.light-theme .obsidian-card {
      background: rgba(248, 250, 252, 0.84) !important;
      border-color: rgba(255, 255, 255, 0.7) !important;
      color: #0f172a !important;
      box-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.14), 0 0 1px 1px rgba(255, 255, 255, 0.4);
    }

    body.light-theme .obsidian-card h1 {
      color: #0f172a !important;
    }

    body.light-theme input {
      background-color: rgba(255, 255, 255, 0.9) !important;
      border-color: rgba(148, 163, 184, 0.6) !important;
      color: #0f172a !important;
    }

    body.light-theme footer {
      background-color: rgba(241, 245, 249, 0.85) !important;
      border-color: rgba(203, 213, 225, 0.7) !important;
      color: #334155 !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white relative">

  <div class="site-mountain-backdrop"></div>

  <header class="relative z-30 border-b border-white/[0.08] bg-transparent backdrop-blur-md sticky top-0">
    <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3 group">
        <div class="w-10 h-10 rounded-xl bg-[#080d1c]/85 border border-white/10 p-1.5 flex items-center justify-center shadow-inner shadow-indigo-500/10">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full drop-shadow-[0_0_8px_rgba(99,102,241,0.5)]">
            <defs>
              <linearGradient id="dlRibbonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8"/>
                <stop offset="60%" stop-color="#6366f1"/>
                <stop offset="100%" stop-color="#4338ca"/>
              </linearGradient>
              <linearGradient id="dlRibbonViolet" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#c084fc"/>
                <stop offset="50%" stop-color="#818cf8"/>
                <stop offset="100%" stop-color="#06b6d4"/>
              </linearGradient>
              <linearGradient id="dlGlassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <path d="M 18,22 C 36,16 74,16 86,22 C 70,32 40,34 18,34 Z" fill="url(#dlRibbonCyan)"/>
            <path d="M 18,22 C 36,16 74,16 86,22 L 78,26 C 66,21 34,21 18,26 Z" fill="url(#dlGlassSheen)"/>
            <path d="M 86,22 L 30,76 L 46,76 L 86,34 Z" fill="url(#dlRibbonViolet)"/>
            <path d="M 14,78 C 26,68 58,66 82,76 C 66,84 32,84 14,78 Z" fill="url(#dlRibbonCyan)"/>
            <path d="M 14,78 C 28,72 60,72 82,76 L 76,80 C 58,76 28,76 14,81 Z" fill="url(#dlGlassSheen)"/>
          </svg>
        </div>
        
        <span class="font-extrabold text-2xl tracking-tight bg-gradient-to-tr from-[#38bdf8] via-[#a855f7] to-[#8a38ca] bg-clip-text text-transparent">
          Zephyr
        </span>
      </a>

      <div class="flex items-center gap-3">
        <button id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Dark / Light Mode" class="w-9 h-9 rounded-xl bg-white/10 hover:bg-white/20 border border-white/20 flex items-center justify-center text-sm font-bold text-amber-400 transition cursor-pointer">
          <span id="themeIcon">☀️</span>
        </button>
        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full border border-indigo-500/30 bg-indigo-500/10 text-indigo-400 text-xs font-semibold backdrop-blur-md">
          <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-pulse"></span>
          Direct Cloudflare Delivery
        </div>
      </div>
    </div>
  </header>

  <main class="relative z-20 max-w-xl mx-auto px-6 py-14 flex-1 flex flex-col items-center justify-center text-center w-full">
    
    <div class="obsidian-card rounded-3xl p-8 sm:p-10 w-full relative">
      
      <div class="w-16 h-16 mx-auto rounded-2xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center mb-5 shadow-lg shadow-indigo-600/20">
        <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
        </svg>
      </div>

      <h1 class="text-xl sm:text-2xl font-bold tracking-tight break-all">
        {{ filename }}
      </h1>
      <p class="text-xs opacity-75 mt-2 font-medium">
        {{ filesize }} MB • Total Downloads: <span id="downloadCount" class="font-bold">{{ downloads }}</span>
      </p>

      <div class="mt-8 space-y-4 text-left">
        <div id="passwordSection" class="{% if not has_password %}hidden{% endif %} space-y-4">
          <div class="rounded-xl border border-amber-500/30 bg-amber-500/10 px-4 py-3 text-xs text-amber-300 flex items-center gap-2.5">
            <svg class="w-4 h-4 text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
            <span>This vault is protected. Enter the passcode to unlock.</span>
          </div>

          <div>
            <label class="block text-xs font-semibold opacity-80 mb-1.5">Recipient Passcode</label>
            <input id="passwordInput" type="password" placeholder="Enter recipient password" 
                   class="w-full bg-slate-900/40 border border-slate-400/30 focus:border-indigo-400 rounded-xl px-4 py-3 text-xs focus:outline-none transition">
          </div>
        </div>

        <div id="errorMsg" class="hidden rounded-xl border border-rose-500/30 bg-rose-500/10 px-4 py-2.5 text-xs text-rose-400 font-medium text-center"></div>

        <button id="downloadBtn" onclick="handleDownload()" 
                class="w-full bg-gradient-to-r from-indigo-600 hover:from-indigo-500 via-purple-600 hover:via-purple-500 to-cyan-600 hover:to-cyan-500 text-white font-bold text-sm py-3.5 rounded-xl shadow-lg shadow-indigo-600/30 active:scale-[0.99] transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer">
          {% if has_password %}Unlock & Download{% else %}Download File{% endif %}
        </button>
      </div>

    </div>

    <p class="mt-8 text-xs opacity-75">
      Need to send large files? <a href="/" class="text-indigo-400 hover:underline font-medium">Send up to 2 GB for free on Zephyr &rarr;</a>
    </p>

  </main>

  <footer class="relative z-20 border-t border-white/[0.08] bg-[#03050c]/80 backdrop-blur-md py-5 text-center text-xs opacity-75">
    © 2026 Zephyr Systems. Zero-knowledge edge transfers.
  </footer>

  <script>
    function initTheme() {
      const savedTheme = localStorage.getItem("zephyr_theme") || "dark";
      const icon = document.getElementById("themeIcon");
      if (savedTheme === "light") {
        document.body.classList.add("light-theme");
        if (icon) icon.innerText = "🌙";
      } else {
        document.body.classList.remove("light-theme");
        if (icon) icon.innerText = "☀️";
      }
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle("light-theme");
      localStorage.setItem("zephyr_theme", isLight ? "light" : "dark");
      const icon = document.getElementById("themeIcon");
      if (icon) icon.innerText = isLight ? "🌙" : "☀️";
    }

    initTheme();

    async function handleDownload() {
      const btn = document.getElementById("downloadBtn");
      const errBox = document.getElementById("errorMsg");
      const pwdSection = document.getElementById("passwordSection");
      const pwdInput = document.getElementById("passwordInput");
      const password = pwdInput ? pwdInput.value.trim() : null;

      errBox.classList.add("hidden");
      btn.disabled = true;
      btn.innerText = "Verifying & Generating Link...";

      try {
        const res = await fetch(window.location.pathname + "/download", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: password })
        });

        const data = await res.json();

        if (!res.ok) {
          if (res.status === 401 || (data.detail && data.detail.toLowerCase().includes("passcode"))) {
            if (pwdSection) pwdSection.classList.remove("hidden");
            btn.innerText = "Unlock & Download";
            if (pwdInput) pwdInput.focus();
          }
          throw new Error(data.detail || "Incorrect passcode or vault expired.");
        }

        const a = document.createElement("a");
        a.href = data.download_url;
        a.download = "{{ filename }}";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        const countSpan = document.getElementById("downloadCount");
        if (countSpan) {
          countSpan.innerText = parseInt(countSpan.innerText || 0) + 1;
        }

        btn.innerText = "✓ Download Started";
        setTimeout(() => {
          btn.disabled = false;
          btn.innerText = "Download Again";
        }, 3000);

      } catch (err) {
        errBox.innerText = err.message;
        errBox.classList.remove("hidden");
        btn.disabled = false;
        btn.innerText = (pwdSection && !pwdSection.classList.contains("hidden")) ? "Unlock & Download" : "Download File";
      }
    }
  </script>
</body>
</html>
